<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title data-t="portail.nom"></title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: content column on the left, glossary pinned on the right (drawer on narrow screens). */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--ink:#17202E;--muted:#5A6577;--line:#D5DBE4;--soft:#EBEFF5;
  --accent:#1B7287;--accent-soft:#E0F0F3;--mark:#FCE9B8;--focus:#E07A2F;
  --k-deck:#3460A8;--k-doc:#2B7549;--k-frise:#A86E12;--k-act:#6A4FA3;--k-prat:#AF4234;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 12px 40px rgba(17,26,40,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D;--surface:#1B212B;--ink:#E9EDF3;--muted:#A3ADBD;--line:#323B49;--soft:#222936;
  --accent:#5FC0D4;--accent-soft:#16303A;--mark:#5A4710;--k-deck:#86A9EC;--k-doc:#6CC58F;--k-frise:#E3AE52;--k-act:#B7A9F2;--k-prat:#EC8A7C;
  --shadow:0 12px 40px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D;--surface:#1B212B;--ink:#E9EDF3;--muted:#A3ADBD;--line:#323B49;--soft:#222936;
  --accent:#5FC0D4;--accent-soft:#16303A;--mark:#5A4710;--k-deck:#86A9EC;--k-doc:#6CC58F;--k-frise:#E3AE52;--k-act:#B7A9F2;--k-prat:#EC8A7C;
  --shadow:0 12px 40px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:inherit}
main{padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.inner{max-width:1080px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:64ch;margin:0}
h2{font-size:19px;margin:36px 0 4px;text-wrap:balance}
.sec-sub{color:var(--muted);margin:0 0 14px;font-size:14px}
/* grilles : 3 colonnes, 2 sur tablette, 1 sur téléphone */
.path,.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.path{counter-reset:st}
.path li{counter-increment:st;display:flex;min-width:0;position:relative}
.path li>.card{flex:1}
.path li::before{content:counter(st);position:absolute;z-index:1;top:8px;left:8px;font-family:var(--mono);font-size:13px;font-weight:500;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none}
@media (max-width:900px){.path,.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.path,.cards{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden;transition:border-color .12s}
.thumb{display:block;position:relative;aspect-ratio:16/9;background:var(--soft);border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.card:hover .thumb img{transform:scale(1.02)}
.thumb img{transition:transform .2s}
.cbody{display:block;padding:12px 14px;min-width:0}
@media (prefers-reduced-motion:reduce){.thumb img{transition:none}.card:hover .thumb img{transform:none}}
.card:hover{border-color:var(--kc)}
.card:focus-visible,.chip:focus-visible,.term-btn:focus-visible,.gl-toggle:focus-visible,.x:focus-visible,.doclink:focus-visible,#q:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--kc)}
.card b{display:block;font-size:15px;line-height:1.35;margin:2px 0}
.card span.d{display:block;color:var(--muted);font-size:13.5px;line-height:1.45}
.card .sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .sub a{font-size:12.5px;text-decoration:none;background:var(--soft);border-radius:6px;padding:2px 8px}
.card .sub a:hover{text-decoration:underline}
.k-deck{--kc:var(--k-deck)}.k-doc{--kc:var(--k-doc)}.k-frise{--kc:var(--k-frise)}.k-act{--kc:var(--k-act)}.k-prat{--kc:var(--k-prat)}
.foot{margin-top:40px;font-size:13px;color:var(--muted)}
/* en-tête : surtitre à gauche, sélecteur de langue à droite */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top .eyebrow{padding-top:11px}
/* étiquette « In French » à côté du type (version anglaise) */
.kline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.infr{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:18px;white-space:nowrap}
</style>
</head>
<body>


<main><div class="inner">
  <div class="top">
    <div class="eyebrow" data-t="accueil.surtitre"></div>
    <div data-langue></div>
  </div>
  <h1 data-t="accueil.titre"></h1>
  <p class="lede" data-t="accueil.intro"></p>

  <h2 data-t="accueil.parcoursTitre"></h2>
  <p class="sec-sub" data-t="accueil.parcoursSousTitre"></p>
  <ol class="path" id="path"></ol>

  <h2 data-t="accueil.frisesTitre"></h2>
  <p class="sec-sub" data-t="accueil.frisesSousTitre"></p>
  <div class="cards" id="frises"></div>

  <h2 data-t="accueil.autresTitre"></h2>
  <div class="cards" id="other"></div>

  <p class="foot" data-t="accueil.pied"></p>
</div></main>


<script src="shared/libelles.js"></script>
<script src="shared/documents.js"></script>
<script src="shared/glossaire.js"></script>
<script>
Promise.all([SAP_LIBELLES,SAP_DOCUMENTS]).then(([T,M])=>{
const tgt=u=>u.startsWith("http")?' target="_blank" rel="noopener"':"";
// aperçu : une page bilingue (frise) a son aperçu anglais <clé>.en.jpg ; s'il manque, l'aperçu français
const apercu=d=>{const bil=window.SAP_LANGUE==='en'&&d.langue==='fr en';
  return bil?`<img src="apercus/${d.cle}.en.jpg" alt="" loading="lazy" onerror="if(!this.dataset.repli){this.dataset.repli=1;this.src='apercus/${d.cle}.jpg'}else{this.parentNode.remove()}">`
            :`<img src="apercus/${d.cle}.jpg" alt="" loading="lazy" onerror="this.parentNode.remove()">`;};
// M.doc donne la carte dans la langue en cours (version anglaise, étiquette « In French »)
const card=key=>{const d=M.doc(key);if(!d)return '';
  const kind=`<span class="kind">${T('types.'+d.type)}</span>`;
  const ligne=d.enFrancais?`<span class="kline">${kind}<span class="infr" lang="en">${T('documents.enFrancais')}</span></span>`:kind;
  return `<a class="card k-${d.type}" href="${window.SAP_HREF(d.fichier)}"${tgt(d.fichier)}><span class="thumb">${apercu(d)}</span><span class="cbody">${ligne}<b>${d.titre}</b><span class="d">${d.description}</span></span></a>`;};
document.getElementById('path').innerHTML=M.section('parcours').map(k=>`<li>${card(k)}</li>`).join('');
document.getElementById('frises').innerHTML=M.section('frises').map(card).join('');
document.getElementById('other').innerHTML=M.section('autres').map(card).join('');
});
</script>

</body>
</html>
