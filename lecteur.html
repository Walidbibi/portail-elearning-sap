<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Lecteur PDF : une page à la fois, flèches pour naviguer, bouton de téléchargement. */
:root{
  --bg:#E6EAF0;--surface:#FFFFFF;--ink:#17202E;--muted:#5A6577;--line:#D5DBE4;--soft:#EBEFF5;
  --accent:#1B7287;--focus:#C25E12;--page-shadow:0 6px 28px rgba(17,26,40,.18);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218;--surface:#1B212B;--ink:#E9EDF3;--muted:#A3ADBD;--line:#323B49;--soft:#222936;
  --accent:#5FC0D4;--page-shadow:0 6px 28px rgba(0,0,0,.6);--focus:#F0A35E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218;--surface:#1B212B;--ink:#E9EDF3;--muted:#A3ADBD;--line:#323B49;--soft:#222936;
  --accent:#5FC0D4;--page-shadow:0 6px 28px rgba(0,0,0,.6);--focus:#F0A35E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,a.btn{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.back{text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap;padding:0 8px;min-height:40px;display:inline-flex;align-items:center;border-radius:6px}
.back:hover{background:var(--soft);color:var(--ink)}
.title{flex:1;min-width:0;display:flex;flex-direction:column}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.title b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:6px}
.ib{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.ib:hover:not([disabled]){border-color:var(--accent)}
.ib[disabled]{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
.count input{width:3.2em;font:inherit;text-align:right;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:8px;background:var(--accent);color:var(--surface);white-space:nowrap}
a.btn svg{width:16px;height:16px}
.ib:focus-visible,a.btn:focus-visible,.back:focus-visible,.count input:focus-visible,.side:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:20px 64px;padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(64px,env(safe-area-inset-right,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
canvas{display:block;background:#fff;box-shadow:var(--page-shadow);border-radius:2px;max-width:100%;max-height:100%}
.side{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.side svg{width:20px;height:20px}
.side.prev{left:max(10px,env(safe-area-inset-left,0px))}.side.next{right:max(10px,env(safe-area-inset-right,0px))}
.side[disabled]{opacity:0;pointer-events:none}
.msg{color:var(--muted);text-align:center;max-width:44ch}
.msg a{color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:0 16px 10px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
/* bandeau « This document is in French » : dans le flux, sous la barre, sans recouvrir la page */
.langnote{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:0;padding:6px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4;min-width:0}
.langnote .fr{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:0 5px;line-height:16px}
.langnote a{color:var(--accent);font-weight:600;text-underline-offset:2px;display:inline-flex;align-items:center;min-height:32px}
@media (max-width:700px){
  .bar{flex-wrap:wrap;row-gap:8px}
  .title{order:-1;flex-basis:calc(100% - 90px)}
  .nav{flex:1;justify-content:center}
  a.btn .lbl{display:none}
  .stage{padding:12px 8px;overflow-y:auto;align-items:flex-start}
  canvas{max-height:none}
  .side{display:none}
  .hint{display:none}
  .sep{display:none}
  .bar .lang{order:1}
  a.btn{order:2}
  .langnote{padding:6px 12px}
}
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="index.html" data-t="lecteur.retour"></a>
  <div class="title"><span class="kind" id="kind" data-t="lecteur.document"></span><b id="doc-title" data-t="lecteur.chargement"></b></div>
  <div class="nav">
    <button class="ib" id="prev" type="button" data-t-aria="lecteur.pagePrecedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="count"><input id="pg" type="text" inputmode="numeric" value="1" data-t-aria="lecteur.numeroPage"> / <span id="total">…</span></span>
    <button class="ib" id="next" type="button" data-t-aria="lecteur.pageSuivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <a class="btn" id="dl" href="#" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl" data-t="lecteur.telecharger"></span></a>
  <span class="sep" aria-hidden="true"></span>
  <div data-langue></div>
</header>
<p class="langnote" id="langnote" lang="en" hidden></p>

<main class="stage" id="stage">
  <button class="side prev" id="sprev" type="button" data-t-aria="lecteur.pagePrecedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <canvas id="cv" data-t-aria="lecteur.pageDuDocument"></canvas>
  <p class="msg" id="msg" hidden></p>
  <button class="side next" id="snext" type="button" data-t-aria="lecteur.pageSuivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
</main>
<p class="hint" data-t="lecteur.aide"></p>

<script src="shared/libelles.js?v=202611241554"></script>
<script src="shared/documents.js?v=202611241554"></script>
<script src="shared/pdfjs/pdf.min.js"></script>
<script>
Promise.all([SAP_LIBELLES,SAP_DOCUMENTS]).then(function([T,M]){
const portail=T('portail.nom');
document.title=T('lecteur.titreOnglet',{portail});
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),msg=$('msg');
const fail=t=>{cv.hidden=true;msg.hidden=false;msg.innerHTML=t;$('doc-title').textContent=T('lecteur.introuvable');};

/* Seuls les PDF déclarés dans documents.json, sous documents/, sont ouverts. */
const src=new URLSearchParams(location.search).get('doc')||'';
const cle=Object.keys(M.documents).find(k=>M.documents[k].fichier===src);
if(!cle||!/^documents\/[\w.-]+\.pdf$/.test(src)){fail(T('lecteur.erreurInconnu'));return;}
// le document tel qu'il est, sans passer à sa version anglaise : le changement de langue garde la page ouverte
const brut=M.documents[cle],en=window.SAP_LANGUE==='en';
const entry={type:brut.type,titre:(en&&brut.en&&brut.en.titre)||brut.titre};
document.title=T('lecteur.titreDocument',{doc:entry.titre,portail});
$('doc-title').textContent=entry.titre;
$('kind').textContent=entry.type?T('types.'+entry.type):T('lecteur.document');
// en anglais, un document en français est annoncé, avec un lien vers sa version anglaise si elle existe
if(en&&(brut.langue||'fr').split(' ').indexOf('en')<0){
  const v=brut.versionEn&&M.documents[brut.versionEn];
  const n=$('langnote');n.hidden=false;
  n.innerHTML=`<span class="fr">FR</span><span>${T(v?'lecteur.bandeauFr':'lecteur.bandeauFrSansVersion')}</span>`+(v?` <a href="lecteur.html?doc=${encodeURIComponent(v.fichier)}">${T('lecteur.versionAnglaise')}</a>`:'');
}
$('dl').href=src;$('dl').setAttribute('download',src.split('/').pop());

if(!window.pdfjsLib){fail(T('lecteur.erreurPdfjs',{src}));return;}
pdfjsLib.GlobalWorkerOptions.workerSrc='shared/pdfjs/pdf.worker.min.js';

const KEY='sap-page:'+src;let pdf=null,page=1,busy=false,queued=null;
const store={get(){try{return +localStorage.getItem(KEY)||1}catch(e){return 1}},set(n){try{localStorage.setItem(KEY,n)}catch(e){}}};

async function render(n){
  if(busy){queued=n;return;}
  busy=true;page=n;
  const p=await pdf.getPage(n);
  const stage=$('stage'),cs=getComputedStyle(stage);
  const availW=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const availH=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const base=p.getViewport({scale:1});
  /* téléphone : pleine largeur, défilement vertical ; ailleurs : page entière visible */
  const narrow=window.matchMedia('(max-width:700px)').matches;
  const scale=Math.max(.1,narrow?availW/base.width:Math.min(availW/base.width,availH/base.height));
  if(narrow)stage.scrollTop=0;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const vp=p.getViewport({scale:scale*dpr});
  cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
  cv.style.width=Math.floor(vp.width/dpr)+'px';cv.style.height=Math.floor(vp.height/dpr)+'px';
  await p.render({canvasContext:ctx,viewport:vp}).promise;
  $('pg').value=n;cv.setAttribute('aria-label',T('lecteur.pageSur',{n,total:pdf.numPages}));
  for(const id of ['prev','sprev'])$(id).disabled=n<=1;
  for(const id of ['next','snext'])$(id).disabled=n>=pdf.numPages;
  store.set(n);busy=false;
  if(queued!==null){const q=queued;queued=null;if(q!==page)render(q);}
}
const go=n=>{if(!pdf)return;n=Math.min(pdf.numPages,Math.max(1,n|0));if(n!==page||busy)render(n);};

$('prev').onclick=$('sprev').onclick=()=>go(page-1);
$('next').onclick=$('snext').onclick=()=>go(page+1);
$('pg').addEventListener('change',e=>go(parseInt(e.target.value,10)||page));
$('pg').addEventListener('focus',e=>e.target.select());
document.addEventListener('keydown',e=>{
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(page+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(page-1);}
  else if(e.key==='Home'){go(1);} else if(e.key==='End'&&pdf){go(pdf.numPages);}
});
/* balayage sur téléphone */
let sx=null;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)go(page+(dx<0?1:-1));});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>pdf&&render(page),150);});

pdfjsLib.getDocument({url:src,isEvalSupported:false}).promise.then(d=>{
  pdf=d;$('total').textContent=d.numPages;render(Math.min(store.get(),d.numPages));
}).catch(()=>fail(T('lecteur.erreurOuverture',{src})));
});
</script>
<script src="shared/glossaire.js?v=202611241554"></script>
</body>
</html>
