<script>
const R={
cp:["Steering committee","Sponsor, process owners, client and integrator program directors. Monthly.","Decides budget, scope, schedule, go/no-go and escalations.","Formally accepting the “standard by default” option when the business is not available.","You come with decisions to make, options and a recommendation, not for status reporting."],
da:["Design authority","Chaired by the solution architect, with the functional leads and the client architect. Weekly.","Guarantees the solution's consistency, decides whether a gap gets developed or not, protects the Clean Core.","Deciding that the certificate check is done in S/4 and not on BTP.","It is what stops custom code from proliferating. Without it, each module optimizes its own corner."],
ccb:["Change control board","Program director, PMO, relevant process owner, architect. Weekly.","Reviews every change after Explore ends: cost, timing, risk. Accepts, rejects or defers.","The traceability screen requested during Realize: estimated, then approved or rejected.","No “small” change outside the board: that is how you prevent scope creep."],
sp:["Sponsor","The client-side executive who owns the program.","Arbitrates budget and scope, frees up business resources, settles conflicts between departments.","Releasing the logistics key users for the workshops.","Never let them discover a problem on their own: inform them early, with options."],
po:["Process owner","The person responsible for a business process, e.g. the head of logistics.","Decides how their process should work, arbitrates gaps, signs off the design.","Deciding that valve receipts go through a systematic quality inspection.","Their availability drives the whole Explore phase. Don't confuse them with the key user, who proposes but does not decide."],
ku:["Key users","The most experienced users, seconded to the project. 3 or 4 out of 80 warehouse operators.","Attend workshops, validate demos, write and run UAT, train their colleagues, provide first-line support after go-live.","The warehouse team lead who plays out a real day of receipts during UAT.","Pick credible people, not the available ones, with a funded backfill for their day job."],
do:["Data owner","The person accountable for data quality in a domain.","Sets the quality rules, has data stewards clean the data, signs off that the data is ready.","Ensuring every valve has a certificate number before the load.","Often confused with the business owner. Key question: at go/no-go, who signs off that the data is ready?"],
dp:["Program director","Accountable for the end-to-end outcome, on the integrator side.","Manages schedule, budget and risks, arbitrates, builds the team, owns the relationship with the sponsor.","Presenting three costed scenarios to run hypercare without stopping the build.","Decide with numbers, escalate at the right level, and always state “what I'll do, with whom, by when”."],
ar:["Solution architect","The guardian of overall consistency.","Ensures consistency across modules, chooses integrations and the level of extension, chairs the design authority.","Choosing between an extension in S/4 and an application on BTP.","One architect, with real authority: two architects means two visions."],
fo:["Functional consultants","One per module: MM, EWM, QM, FI… with a lead per domain.","Run workshops, write specifications, configure, test, fix, train key users.","Configuring the EWM receipt and describing the “missing certificate” block to the developer.","Watch out for the one who says yes to everything (a source of custom code) and the one who stays locked in their module."],
de:["Developers","ABAP, ABAP Cloud or BTP profiles.","Build the RICEFW objects from the specifications and run their unit tests.","Coding the certificate block on an SAP-released extension point.","Headcount follows from the RICEFW list. No code without an approved spec, and always through SAP-released objects."],
dt:["Data team","Data lead and analysts.","Extract, cleanse, transform, load and reconcile data, at every mock load.","Checking that 1,240 valves in the legacy system = 1,240 valves in EWM.","Must start during Explore. Key indicator: the rejection rate at mock loads."],
te:["Test team","Test lead and testers.","Write the test strategy and test cases, run end-to-end SIT, automate regression testing, lead defect triage.","A SIT case that checks the accounting entry of the receipt, not just that it goes through.","Often under-sized. Functional consultants testing their own work don't see what they didn't imagine."],
ch:["Change management","Change lead and trainers.","Analyzes impact by business area, builds the training and communication plan, runs the key user network.","Training 80 warehouse operators on EWM across three sites before go-live.","Starts during Explore. Trained doesn't mean ready: check with a hands-on test and verify authorizations."],
ba:["Basis and run","The SAP technical team, and the team that maintains the system after go-live.","Manages systems, environments, transports, performance, conversion and technical cutover, then incidents and fixes.","Fitting the conversion into the weekend downtime window.","If Basis is shared with run, reserve capacity for the project: a production incident always comes first."]
};
const L=["Who","What they do","Valve example","Watch out for"];
let cur=null;
function show(g){
  const r=R[g.dataset.k];if(!r)return;
  if(cur)cur.classList.remove('sel');cur=g;g.classList.add('sel');
  const p=document.getElementById('panel');p.textContent='';
  const h=document.createElement('h2');h.textContent=r[0];p.appendChild(h);
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='row';
    const a=document.createElement('span');a.className='lab';a.textContent=L[i];
    const b=document.createElement('span');b.textContent=r[i+1];d.append(a,b);p.appendChild(d);}
}
document.querySelectorAll('.n').forEach(g=>{
  g.addEventListener('click',()=>show(g));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(g);}});
});
</script>
