<script type="application/json" id="ecc-data">{"lang": "fr", "eb": "De ECC à S/4HANA", "titre": "ECC et S/4HANA en un coup d'œil", "message": "S/4HANA n'est pas une nouvelle version d'ECC. C'est un nouveau produit, sur une seule base de données, avec un modèle de données plus simple. Le passage est un programme, pas une montée de version.", "colEcc": ["ECC · SAP ERP 6.0", "L'ERP historique, toutes bases de données"], "colS4": ["S/4HANA", "Le successeur, sur HANA seule, depuis 2015"], "rangees": [{"id": "r1", "dimension": "Base de données", "qui": ["Équipe IT", "Contrat"], "ecc": "Toutes bases (Oracle, DB2, SQL Server…)", "s4": "HANA seule, en mémoire", "enEcc": "ECC tourne sur la base de données choisie par l'entreprise : Oracle, IBM DB2, Microsoft SQL Server, SAP ASE, SAP MaxDB ou SAP HANA. La base stocke les données sur disque et garde des tables de totaux pour répondre vite.", "enS4": "S/4HANA ne tourne que sur **HANA**, la base de SAP qui garde les données en mémoire et les range par colonnes. Elle calcule les totaux à la demande, sans tables intermédiaires. C'est ce qui permet le modèle de données simplifié (rangée 2).", "concret": "Changer de produit oblige à changer de base, si l'entreprise n'est pas déjà sur HANA. Un ECC déjà sur HANA (« Suite on HANA ») reste un ECC : la base seule ne fait pas S/4HANA. La taille de la mémoire dépend du volume de données : moins de données anciennes, moins de mémoire à payer.", "exemple": "Si l'ECC de Ternova (fictif, scénario brownfield) tourne sur une autre base que HANA, sa conversion comprend aussi la migration de base vers HANA, faite en même temps (DMO).", "dp": "Trois sujets sur le chemin critique technique dès le cadrage. Le dimensionnement (**Sizing**), qui fixe le coût d'infrastructure. L'**Archivage** des données anciennes, qui réduit la mémoire et la **Fenêtre de coupure**. La migration de base (**DMO**) si l'ERP n'est pas déjà sur HANA. Faire chiffrer les trois avant de signer le budget."}, {"id": "r2", "dimension": "Modèle de données", "qui": ["Finance", "Équipe IT"], "ecc": "Tables multiples, agrégats, réconciliations", "s4": "Tables uniques, calcul à la volée", "enEcc": "Une même opération s'écrit dans plusieurs tables. Un mouvement de stock va dans une table d'en-tête, une table de postes et des tables de stock agrégé. Une écriture de coût va d'un côté en comptabilité générale (**FI**), de l'autre en contrôle de gestion (**CO**). Clients et fournisseurs ont chacun leur fiche.", "enS4": "Une table par grand objet. Les mouvements de stock vont dans **MATDOC**. Les écritures de FI et de CO vont ensemble dans le **Universal Journal**. Clients et fournisseurs deviennent des **Business Partner**. Les tables d'agrégats disparaissent : HANA calcule les totaux à la lecture.", "concret": "Moins de réconciliations entre la logistique, la comptabilité et le contrôle de gestion. Mais tout programme spécifique qui écrivait dans les anciennes tables doit être repris, et les fiches clients et fournisseurs doivent être converties avant la migration (**CVI**).", "exemple": "La réception des 1 240 vannes de carburant à 500 € (chiffres fictifs). En ECC, elle s'écrit dans quatre à cinq tables : document article, stock agrégé, pièce comptable de 620 000 €. En S/4HANA, une ligne dans MATDOC pour le stock et des lignes dans le Universal Journal pour la valeur, où la finance et le contrôle de gestion lisent les mêmes données.", "dp": "C'est la dimension la plus coûteuse d'une conversion, et la moins visible au comité. Demander tôt deux chiffres : le nombre de programmes spécifiques touchés (analyse **ATC**) et le nombre de fiches clients et fournisseurs en erreur de conversion. Le détail est dans le schéma 3."}, {"id": "r3", "dimension": "Interface", "qui": ["Utilisateurs"], "ecc": "SAP GUI, écrans par transaction", "s4": "Fiori, applications par rôle", "enEcc": "L'utilisateur travaille dans **SAP GUI**, un logiciel installé sur le poste. Il ouvre des transactions par leur code (par exemple ME21N pour créer une commande d'achat) et passe d'un écran dense à l'autre.", "enS4": "**Fiori** est l'interface cible : des applications web, dans un navigateur, sur ordinateur, tablette ou téléphone. Chaque utilisateur voit les applications de son rôle (**Business Roles / Business Catalogs**). Sur site et en cloud privé, SAP GUI reste utilisable pour de nombreuses transactions. En cloud public, l'accès passe par Fiori.", "concret": "C'est le changement que tout le monde voit le premier jour. Les gestes changent, les droits d'accès se refont par rôle, la formation change de nature.", "exemple": "En ECC, le magasinier saisit la réception des vannes sur un poste fixe en SAP GUI. En S/4HANA, il peut la confirmer sur une application Fiori, depuis une tablette, au quai de réception.", "dp": "Décider tôt, rôle par rôle, qui passe à Fiori au démarrage et qui garde SAP GUI. Sans cette décision, on forme deux fois et on refait les rôles deux fois. Le chantier des rôles et habilitations est souvent sous-estimé : le chiffrer à part."}, {"id": "r4", "dimension": "Analytique", "qui": ["Utilisateurs", "Finance"], "ecc": "Rapports la nuit, entrepôt de données séparé", "s4": "Analytique embarquée, temps réel", "enEcc": "Les rapports opérationnels sont lents sur les gros volumes. On copie donc les données, souvent la nuit, dans un entrepôt de données séparé (**BW**) pour les analyser. Les chiffres du matin sont ceux de la veille.", "enS4": "L'**Analytique embarquée** lit les données directement dans le système, en temps réel, grâce à HANA. Les rapports opérationnels (stock, commandes en retard, marge) n'ont plus besoin de copie. Un entrepôt de données reste utile pour consolider plusieurs systèmes ou de longs historiques ; **SAP Analytics Cloud** sert aux tableaux de bord et à la planification.", "concret": "Une partie des rapports BW et des rapports spécifiques n'a plus de raison d'être. Le reporting change de forme pour le métier : moins de fichiers du matin, plus d'indicateurs à jour dans les applications.", "exemple": "La vente de 12 vannes à 900 € (chiffres fictifs). En ECC, la marge (10 800 € de chiffre d'affaires, 6 000 € de coût, 4 800 € de marge) apparaît dans le rapport du lendemain. En S/4HANA, elle est visible dès la sortie de marchandises et la facture.", "dp": "Inscrire l'inventaire des rapports au périmètre, dès le cadrage : lesquels garder, lesquels remplacer par l'analytique embarquée, lesquels supprimer. Désigner un responsable du reporting. Sinon le métier découvre au démarrage que ses rapports du lundi ont disparu."}, {"id": "r5", "dimension": "Extension", "qui": ["Équipe IT", "Contrat"], "ecc": "Code Z, modifications du standard", "s4": "Clean Core : extensions prévues, BTP", "enEcc": "L'entreprise adapte le système par du **Développement Z** : programmes spécifiques, et parfois modifications du code standard de SAP. Après quinze ou vingt ans, un ECC compte souvent des milliers d'objets spécifiques (**Dette technique**).", "enS4": "SAP pousse le **Clean Core** : ne pas modifier le standard, étendre seulement par des moyens prévus. Trois niveaux : l'extension sans code par un utilisateur avancé (**Key User Extensibility**, dite « in-app »), le développement dans le système avec des règles strictes (**ABAP Cloud**, **API publiée**), et le développement à côté du système, sur **BTP** (**Extension side-by-side**). En cloud public, seules ces voies sont ouvertes.", "concret": "Chaque développement spécifique d'ECC doit être jugé : supprimé (le standard le fait), refait selon les règles du Clean Core, ou gardé tel quel en sachant qu'il ralentira les montées de version.", "exemple": "Ternova (fictif) veut un champ « numéro de certification » sur la fiche de la vanne. En ECC, un développeur ajoute un champ Z à la table et modifie l'écran. En S/4HANA, un utilisateur avancé ajoute le champ par Key User Extensibility, sans code, et le champ survit aux montées de version.", "dp": "Le volume de code spécifique est un des premiers chiffres à obtenir, et l'une des premières décisions de gouvernance. Donner à la **Design authority** le mandat de refuser un développement qui contourne le standard. Le coût d'un spécifique ne s'arrête pas au projet : il se paie à chaque montée de version."}, {"id": "r6", "dimension": "Déploiement et rythme", "qui": ["Contrat", "Équipe IT"], "ecc": "Sur site, packages d'amélioration", "s4": "Sur site, cloud privé ou public ; versions régulières", "enEcc": "Le système est installé **On-premise** (chez l'entreprise ou chez un hébergeur). Les nouveautés arrivent par des packages d'amélioration (**EhP**) que l'entreprise installe quand elle veut. Le dernier, l'EhP 8, date de 2016 : ECC ne reçoit plus de nouveautés.", "enS4": "Trois modes. Sur site, géré par l'entreprise. En cloud privé (**SAP Cloud ERP**, version Private, vendue dans **RISE with SAP**) : un système dédié, hébergé et opéré en partie par SAP. En cloud public (SAP Cloud ERP, version publique) : un système partagé, standard, sans code dans le cœur (**Cloud public / Cloud privé**). Le rythme suit le mode. Sur site et en cloud privé : une nouvelle version tous les deux ans depuis la version 2023, maintenue sept ans, avec des **Feature Pack Stack** tous les six mois pendant ses deux premières années ; l'entreprise choisit quand monter. En cloud public : deux versions par an, imposées par SAP.", "concret": "Le choix du mode change le contrat (licence ou abonnement), la répartition des rôles avec SAP et le droit d'adapter le système. Après le démarrage, la **Montée de version** devient régulière : ce n'est plus un projet tous les dix ans, c'est un cycle.", "exemple": "Calvane et Ternova (fictifs) ont choisi le cloud privé via RISE (voir leurs scénarios). Calvane, qui part de zéro, aurait pu viser le cloud public : il aurait alors accepté un standard strict et deux montées de version par an.", "dp": "Le mode de déploiement se décide avant le choix du chemin de migration, car il le contraint (le cloud public n'accepte qu'une nouvelle implémentation). Après le démarrage, prévoir au budget de run une équipe et un calendrier de tests de non-régression pour chaque montée de version. Plus le cœur est propre (rangée 5), plus ce cycle coûte peu."}], "bandeau": {"id": "bandeau", "dimension": "Passer de l'un à l'autre", "titre": "Passer de l'un à l'autre : échéances et chemins", "sousTitre": "Échéances de maintenance et trois chemins de migration.", "qui": ["Direction", "Contrat"], "enEcc": "Maintenance standard jusqu'à fin 2027. Maintenance étendue payante de 2028 à fin 2030 (**Maintenance étendue**). Au-delà, seulement pour des systèmes déplacés en cloud privé avant fin 2030 : la **Transition option**, de 2031 à 2033, et jusqu'à fin 2035 sous conditions depuis octobre 2026.", "enS4": "SAP s'engage à maintenir S/4HANA au moins jusqu'à fin 2040. Chaque version sur site ou en cloud privé est maintenue sept ans, ce qui oblige à monter de version au moins une fois dans cette période.", "concret": "Trois chemins pour passer. **Greenfield** : nouvelle implémentation, on repart du standard et on ne reprend que les données utiles. **Brownfield** : conversion du système existant, avec son paramétrage, son code et son historique. **Bluefield** : transition sélective, on garde une partie et on reconçoit le reste.", "exemple": "Les quatre entreprises fictives du portail suivent chacune un chemin : Calvane (greenfield), Ternova (brownfield), Alvéa (bluefield), Nordval (roll-out d'un modèle déjà en place vers un nouveau site).", "dp": "Partir de l'échéance et rétroplanifier. Pour un programme qui démarre fin 2026, fin 2027 est très proche : la maintenance étendue devient souvent l'hypothèse réaliste, et son surcoût entre dans le **Business case**. Le choix du chemin se fait par un comité de direction, sur la base du SAP Readiness Check et de l'ambition de transformation, pas par l'équipe technique seule.", "echeances": [["Fin 2027", "Fin de la maintenance standard d'ECC", ""], ["Fin 2030", "Fin de la maintenance étendue, payante", ""], ["2031 à 2033 (2035)", "Transition option, cloud privé, sous conditions ; jusqu'à fin 2035 sous conditions de plus", ""], ["Fin 2040", "S/4HANA maintenu au moins jusque-là", "s4"]], "cheminsTitre": "Trois chemins : ouvrir le scénario de mise en œuvre", "chemins": [["Greenfield", "Calvane (fictif)", "frises/greenfield.html"], ["Brownfield", "Ternova (fictif)", "frises/brownfield.html"], ["Bluefield", "Alvéa (fictif)", "frises/bluefield.html"]]}, "plus": [["Ce qui change, étape par étape (P2P)", "schemas/flux-p2p.html?vue=s4"], ["L'entrepôt : quelle cible pour LE-WM", "schemas/ecc-entrepot.html"], ["Disparaît, remplacé, obligatoire", "schemas/ecc-changements.html"], ["Deck · Migration ECC vers S/4HANA", "documents/migration-ecc-s4hana.pdf"]], "date": "Dates lues le 26/11/2026."}</script>
