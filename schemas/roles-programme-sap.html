<script>
const R={
cp:["Comité de pilotage","Sponsor, process owners, directeurs de programme client et intégrateur. Mensuel.","Décide du budget, du périmètre, du planning, des go/no-go et des escalades.","Accepter par écrit l'option « standard par défaut » quand le métier n'est pas disponible.","On y vient avec des décisions à prendre, des options et une recommandation, pas pour du reporting."],
da:["Design authority","Présidée par l'architecte solution, avec les leads fonctionnels et l'architecte client. Hebdomadaire.","Garantit la cohérence de la solution, décide si un écart se développe ou non, garde le Clean Core.","Décider que le contrôle du certificat se fait dans S/4 et non sur BTP.","C'est elle qui empêche le spécifique de proliférer. Sans elle, chaque module optimise son coin."],
ccb:["Comité des changements","Directeur de programme, PMO, process owner concerné, architecte. Hebdomadaire.","Examine tout changement après la fin de l'Explore : coût, délai, risque. Accepte, refuse ou reporte.","L'écran de traçabilité demandé en Realize : chiffré, puis validé ou refusé.","Aucun « petit » changement hors comité : c'est comme ça qu'on évite la dérive de périmètre."],
sp:["Sponsor","Le dirigeant côté client qui porte le programme.","Arbitre budget et périmètre, débloque les ressources du métier, tranche les conflits entre directions.","Libérer les key users de la logistique pour les ateliers.","Ne jamais le laisser découvrir un problème seul : on l'informe tôt, avec des options."],
po:["Process owner","Le responsable d'un processus métier, par exemple le responsable logistique.","Décide comment son processus doit fonctionner, arbitre les écarts, signe la conception.","Décider que la réception des vannes passe par un contrôle qualité systématique.","Sa disponibilité conditionne tout l'Explore. Ne pas le confondre avec le key user, qui propose mais ne décide pas."],
ku:["Key users","Les utilisateurs les plus expérimentés, détachés sur le projet. 3 ou 4 sur 80 magasiniers.","Participent aux ateliers, valident les démos, écrivent et jouent l'UAT, forment leurs collègues, premier support après le go-live.","Le chef d'équipe magasin qui joue sa vraie journée de réceptions en recette.","Choisir des personnes crédibles, pas les disponibles, avec un remplacement financé sur leur poste."],
do:["Data owner","Le responsable de la qualité des données d'un domaine.","Fixe les règles de qualité, fait nettoyer par des data stewards, signe que ses données sont prêtes.","Garantir que chaque vanne a un numéro de certificat avant le chargement.","Souvent confondu avec le business owner. Question clé : au go/no-go, qui signe que les données sont prêtes ?"],
dp:["Directeur de programme","Le responsable du résultat de bout en bout, côté intégrateur.","Pilote planning, budget et risques, arbitre, compose l'équipe, porte la relation avec le sponsor.","Présenter trois scénarios chiffrés pour mener l'hypercare sans arrêter le build.","Décider avec des chiffres, escalader au bon niveau, et toujours dire « je fais quoi, avec qui, d'ici quand »."],
ar:["Architecte solution","Le garant de la cohérence de l'ensemble.","Assure la cohérence entre modules, choisit les intégrations et le niveau d'extension, préside la design authority.","Trancher entre une extension dans S/4 et une application sur BTP.","Un seul architecte, avec une vraie autorité : deux architectes, c'est deux visions."],
fo:["Consultants fonctionnels","Un par module : MM, EWM, QM, FI… avec un lead par domaine.","Animent les ateliers, écrivent les spécifications, paramètrent, testent, corrigent, forment les key users.","Paramétrer la réception EWM et décrire au développeur le blocage « certificat manquant ».","Surveiller celui qui dit oui à tout (source de spécifique) et celui qui reste enfermé dans son module."],
de:["Développeurs","Profils ABAP, ABAP Cloud ou BTP.","Construisent les objets RICEFW à partir des spécifications, font leurs tests unitaires.","Coder le blocage du certificat sur un point d'entrée publié par SAP.","Leur nombre se déduit du RICEFW. Pas de code sans spécification validée, et toujours via les objets publiés par SAP."],
dt:["Équipe data","Responsable data et analystes.","Extraient, nettoient, transforment, chargent et réconcilient les données, à chaque chargement à blanc.","Vérifier que 1 240 vannes dans l'ancien système = 1 240 vannes dans EWM.","Doit démarrer dès l'Explore. Indicateur clé : le taux de rejet aux chargements à blanc."],
te:["Équipe de test","Responsable test et testeurs.","Écrit la stratégie et les cas de test, pilote la SIT de bout en bout, automatise la non-régression, anime le triage des anomalies.","Un cas SIT qui vérifie l'écriture comptable de la réception, pas seulement qu'elle passe.","Souvent sous-dimensionnée. Les fonctionnels qui se testent eux-mêmes ne voient pas ce qu'ils n'ont pas imaginé."],
ch:["Conduite du changement","Responsable changement et formateurs.","Analyse l'impact par métier, construit le plan de formation et la communication, anime le réseau de key users.","Former 80 magasiniers à EWM sur trois sites avant le go-live.","Démarre dès l'Explore. Formé ne veut pas dire prêt : test pratique et habilitations à vérifier."],
ba:["Basis et run","L'équipe technique SAP, et l'équipe qui maintient le système après le go-live.","Gère systèmes, environnements, transports, performance, conversion et bascule technique, puis incidents et correctifs.","Faire tenir la conversion dans la fenêtre d'arrêt du week-end.","Si le Basis est partagé avec le run, réserver une capacité au projet : l'incident de production passe toujours en premier."]
};
const L=["Qui","Ce qu'il fait","Exemple vanne","À surveiller"];
let cur=null;
function show(g){
  const r=R[g.dataset.k];if(!r)return;
  if(cur)cur.classList.remove('sel');cur=g;g.classList.add('sel');
  const p=document.getElementById('panel');p.textContent='';
  const h=document.createElement('h2');h.textContent=r[0];p.appendChild(h);
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='row';
    const a=document.createElement('span');a.className='lab';a.textContent=L[i];
    const b=document.createElement('span');b.textContent=r[i+1];d.append(a,b);p.appendChild(d);}
}
document.querySelectorAll('.n').forEach(g=>{
  g.addEventListener('click',()=>show(g));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(g);}});
});
</script>
