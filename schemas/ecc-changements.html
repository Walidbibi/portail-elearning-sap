<script type="application/json" id="ecc-data">{"lang": "fr", "eb": "De ECC à S/4HANA", "titre": "Disparaît, remplacé, devient obligatoire", "intro": "Les changements imposés par S/4HANA qui touchent la logistique et sa finance. Pas toute la liste des **simplification items** (plusieurs centaines) : ceux qu'un DP logistique retrouve en comité.", "colonnes": [["dis", "Disparaît"], ["rep", "Remplacé par"], ["obl", "Devient obligatoire"]], "domaines": ["MM", "SD", "PP", "WM", "FI/CO", "Données", "Technique"], "cartes": [{"n": 1, "c": "dis", "t": "Tables d'agrégats de stock", "dom": ["MM"], "lbl": "MM", "eff": "Moyen", "e": 2, "ecc": "Le document article est écrit en deux tables (en-tête MKPF, postes MSEG) ; des tables d'agrégats tiennent les quantités en stock à jour, pour aller vite sur des bases classiques.", "s4": "Une seule table, **MATDOC**. Le stock se calcule à la lecture, HANA est assez rapide. Les anciennes tables restent lisibles par des vues de compatibilité.", "qui": "Développeurs (programmes spécifiques), équipe reporting, interfaces qui lisent le stock.", "dp": "Effort caché dans le code spécifique. Demander le nombre de programmes qui écrivent dans ces tables (rapport ATC). Celui qui lit seulement passe en général ; celui qui écrit doit être repris."}, {"n": 2, "c": "dis", "t": "Tables d'index et de totaux de la finance", "dom": ["FI/CO"], "lbl": "FI/CO", "eff": "Moyen", "e": 2, "ecc": "FI et CO écrivent dans des tables séparées, avec des tables de totaux et d'index pour accélérer les états. Les deux doivent être réconciliés.", "s4": "Les écritures vont dans le **Universal Journal** (ACDOCA) ; totaux et index se calculent à la volée.", "qui": "Comptables, contrôleurs de gestion, reporting financier, interfaces vers la consolidation.", "dp": "Les réconciliations FI / CO disparaissent, ce qui est un gain. Mais la conversion des données financières exige des comptes propres avant la bascule : caler la date sur le calendrier de clôture et prévoir des contrôles de soldes avant / après."}, {"n": 3, "c": "dis", "t": "LE-WM", "dom": ["WM"], "lbl": "WM", "eff": "Fort", "e": 3, "ecc": "Gestion d'entrepôt dans l'ERP.", "s4": "N'est plus que dans les compatibility packs, avec un droit d'usage limité (voir schéma 2).", "qui": "Tout l'entrepôt.", "dp": "Décision à prendre dès le cadrage. Renvoi au schéma 2.", "lien": ["Ouvrir le schéma de l'entrepôt", "schemas/ecc-entrepot.html"]}, {"n": 4, "c": "rep", "t": "Gestion du crédit SD → SAP Credit Management", "dom": ["SD", "FI/CO"], "lbl": "SD/FI", "eff": "Moyen à fort", "e": 3, "ecc": "Limites de crédit et contrôle dans SD (gestion du crédit FI-AR).", "s4": "L'ancienne gestion du crédit n'existe plus. Son équivalent est **SAP Credit Management** (FSCM), avec un score, des règles et un dossier de crédit par Business Partner.", "qui": "Credit managers, service client, comptabilité clients.", "dp": "Traiter comme un chantier fonctionnel avec ses ateliers et sa reprise de données (limites, historiques). Un blocage de crédit mal paramétré arrête les expéditions dès le premier jour."}, {"n": 5, "c": "rep", "t": "Ristournes SD → contrats de conditions (Settlement Management)", "dom": ["SD"], "lbl": "SD", "eff": "Moyen", "e": 2, "ecc": "Accords de ristourne dans SD.", "s4": "Contrats de conditions, réglés par le **Settlement Management**. C'est la cible obligatoire.", "qui": "Administration des ventes, contrôle de gestion, achats (ristournes fournisseurs).", "dp": "Solder les accords en cours avant la bascule ; recréer les nouveaux. Caler la date de conversion sur le calendrier des ristournes."}, {"n": 6, "c": "rep", "t": "ATP → ATP avancé (aATP)", "dom": ["SD", "PP"], "lbl": "SD/PP", "eff": "Moyen", "e": 2, "ecc": "Contrôle de disponibilité classique, allocation de produits limitée.", "s4": "**aATP** : confirmation par lots de commandes, règles d'allocation, priorités par client. Le périmètre exact remplacé dépend de la version (à vérifier sur le catalogue des simplification items).", "qui": "Service client, planificateurs, direction commerciale (qui est servi en premier).", "dp": "Les règles de priorité sont une décision métier, pas un paramétrage. Les faire valider en comité. Suivre l'OTD avant et après."}, {"n": 7, "c": "rep", "t": "MRP classique → MRP Live", "dom": ["PP", "MM"], "lbl": "PP/MM", "eff": "Faible", "e": 1, "ecc": "MRP en lot, la nuit.", "s4": "**MRP Live**, en minutes. L'ancien MRP reste disponible pour certains cas.", "qui": "Planificateurs.", "dp": "Gain rapide à montrer au métier. Tester les résultats sur un jeu de données identique."}, {"n": 8, "c": "rep", "t": "Messages NAST → output management", "dom": ["SD", "MM"], "lbl": "SD/MM", "eff": "Moyen", "e": 2, "ecc": "Éditions (commandes, factures, bons de livraison) par le système de messages NAST.", "s4": "Nouvel **Output management** (règles BRF+) proposé ; l'ancien système reste possible selon les cas (à vérifier pour la version cible).", "qui": "Équipe éditions, utilisateurs qui impriment ou envoient des documents.", "dp": "Compter les formulaires au cadrage. Chaque formulaire est un objet à retester, parfois à refaire."}, {"n": 9, "c": "rep", "t": "SAP GUI → Fiori", "dom": ["*"], "lbl": "Tous", "eff": "Moyen", "e": 2, "ecc": "Écrans SAP GUI.", "s4": "**Fiori** devient l'interface cible ; SAP GUI reste utilisable pour beaucoup de transactions.", "qui": "Tous les utilisateurs, la formation.", "dp": "Décider tôt quels rôles passent à Fiori au démarrage. Sinon la formation se fait deux fois."}, {"n": 10, "c": "obl", "t": "Base HANA", "dom": ["Technique"], "lbl": "Technique", "eff": "Moyen", "e": 2, "pre": 1, "ecc": "Toute base (Oracle, DB2, SQL Server…).", "s4": "**HANA** uniquement.", "qui": "Équipe Basis, hébergeur.", "dp": "Dimensionnement (**Sizing**) et migration de base (**DMO**) sur le chemin critique technique. La migration de base se fait pendant la conversion ; le préalable, c'est le dimensionnement et l'archivage. Le volume de données fixe la fenêtre d'arrêt : archiver avant."}, {"n": 11, "c": "obl", "t": "Universal Journal et Material Ledger", "dom": ["FI/CO", "MM"], "lbl": "FI/CO/MM", "eff": "Moyen", "e": 2, "pre": 1, "ecc": "La valorisation du stock en plusieurs devises (Material Ledger) est optionnelle.", "s4": "Le **Material Ledger** est actif pour la valorisation du stock ; toutes les écritures vont dans le **Universal Journal**.", "qui": "Contrôle de gestion, comptabilité, logistique (valorisation des mouvements).", "dp": "Préalable : dans ECC, rapprocher les comptes et passer les contrôles de cohérence de la finance avant la conversion ; une période mal clôturée bloque la migration des données financières. Ensuite, la logistique change ses chiffres en finance sans changer ses gestes. Prévoir des tests de valorisation sur des mouvements réels (réception, sortie, inventaire) et la signature du contrôle de gestion."}, {"n": 12, "c": "obl", "t": "Business Partner", "dom": ["Données"], "lbl": "Données", "eff": "Fort", "e": 3, "pre": 1, "ecc": "Une fiche client et une fiche fournisseur distinctes, même pour une entreprise qui est les deux.", "s4": "Une seule fiche, le **Business Partner**, avec des rôles. Sans Business Partner pour chaque client et chaque fournisseur, la conversion ne démarre pas.", "qui": "Équipe données de base, achats, ventes, comptabilité, interfaces.", "dp": "Préalable bloquant d'un brownfield. La conversion (**CVI**) se fait dans ECC, avant la conversion du système. Le nettoyage (doublons, adresses, coordonnées bancaires) prend des mois. Chemin critique fréquent."}, {"n": 13, "c": "obl", "t": "Numéro d'article long (jusqu'à 40 caractères)", "dom": ["MM"], "lbl": "MM/Interfaces", "eff": "Faible à moyen", "e": 2, "ecc": "Numéro d'article jusqu'à 18 caractères.", "s4": "Le champ peut aller jusqu'à 40 caractères ; l'extension s'active ou non (à vérifier selon la version et le choix du programme).", "qui": "Interfaces, éditions, partenaires externes.", "dp": "Décision d'architecture à prendre une fois. Si elle est activée, chaque interface qui transporte un numéro d'article est à retester."}], "pied": "La liste exacte dépend de votre système : elle sort du **SAP Readiness Check** et du **Simplification Item Check**.", "plus": [["ECC et S/4HANA en un coup d'œil", "schemas/ecc-s4hana.html"], ["Ce qui change, étape par étape (P2P)", "schemas/flux-p2p.html?vue=s4"], ["Ce qui change, étape par étape (O2C)", "schemas/flux-o2c.html?vue=s4"], ["L'entrepôt : quelle cible pour LE-WM", "schemas/ecc-entrepot.html"]]}</script>
