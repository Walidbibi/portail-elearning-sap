<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/frise.css">
</head>
<body>

<!-- Page de frise : le contenu vient de brownfield.json, l'affichage de shared/frise.js. -->
<div class="wrap">
  <div class="fz-top">
    <button type="button" class="back" onclick="history.length>1?history.back():(location.href='../')" data-t="frise.retour"></button>
    <div data-langue></div>
  </div>
  <div class="eyebrow" id="f-surtitre"></div>
  <h1 id="f-titre"></h1>
  <p class="lede" id="f-intro"></p>
  <div class="story">
    <span id="f-exemple"><b data-t="frise.exempleFilRouge"></b></span>
    <button type="button" class="startb" id="start" data-t="frise.suivreExemple"></button>
  </div>
  <div class="tl-wrap"><svg id="tl" role="img"></svg></div>
  <div class="legend">
    <span><i class="lg-bar"></i><span data-t="frise.legendeEtape"></span></span><span><i class="lg-gate"></i><span id="f-legende-gate" data-t="frise.legendeGate"></span></span><span><i class="lg-gl"></i><span data-t="frise.legendeGolive"></span></span>
  </div>
  <button class="band" id="band" data-k="transverse" type="button"><b data-t="frise.enContinu"></b> <span id="f-continu"></span></button>
  <div class="fail" id="f-causes">
    <h3 id="f-causes-titre"></h3>
  </div>
  <p class="note" id="f-note"></p>
</div>

<div class="ov" id="ov" hidden>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <button class="x" id="x" type="button" data-t-aria="frise.fermer">×</button>
    <div id="dlg-body"></div>
  </div>
</div>

<script src="../shared/libelles.js"></script>
<script src="../shared/documents.js"></script>
<script src="../shared/frise.js" data-frise="brownfield.json"></script>
<script src="../shared/glossaire.js"></script>
</body>
</html>
